name: CI

on:
  push:
    # main is tested by deploy.yml, which calls this workflow.
    branches-ignore: [main]
  pull_request:
  # deploy.yml runs the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      # The a-Shell script behind Mitschnitt; the runner's own Python is enough.
      - name: Python tests
        run: python3 -m unittest discover -s tests/python -v

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.js builds the app and serves it with vite preview.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
